name: Build master

# Narrowed for the fork: the 26.2 port uses ci-26.2.yml (JDK 25) instead of this legacy JDK 17 job.
on:
  push:
    branches:
      - '1.21.x'
  pull_request:
    branches:
      - '1.21.x'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - id: var
      name: Setup variables
      run: echo ::set-output name=commit_hash::${GITHUB_SHA:0:7}
    - uses: actions/checkout@v2
    - name: Set up JDK 17
      uses: actions/setup-java@v1
      with:
        java-version: 17
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Build with Gradle
      run: ./gradlew build
      env:
        MI_VERSION: 0.0.0-git-${{ steps.var.outputs.commit_hash }}
    - name: Gametest Server
      run: |
        ./gradlew runGameTestServer
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Modern Industrialization ${{ steps.var.outputs.commit_hash }}
        path: build/libs

modLoader="javafml"
loaderVersion="[2,)"
license="MIT"
issueTrackerURL="https://github.com/AztechMC/Modern-Industrialization/issues"

[[mods]]
modId="modern_industrialization"
version="${mod_version}"
displayName="Modern Industrialization"
displayURL="https://github.com/AztechMC/Modern-Industrialization"
logoFile="assets/modern_industrialization/milogo.png"
authors="Azerococo,Technici4n"
description='''A modern industrial mod for Minecraft.'''

[[mixins]]
config="modern_industrialization.mixins.json"

[[dependencies.modern_industrialization]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

# TEMPORARY (26.2 port): GuideME has no 26.2 build yet (its 3D scene renderer needs the Vulkan
# render rework). Downgraded to optional so MI boots on 26.2 without it; the in-game guidebook is
# disabled until a 26.2 GuideME is available. Revert to "required" once that ships.
[[dependencies.modern_industrialization]]
modId="guideme"
type="optional"
versionRange="${guideme_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.modern_industrialization]]
modId="ae2"
type="optional"
versionRange="${ae2_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.modern_industrialization]]
modId="kubejs"
type="optional"
versionRange="${kubejs_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.modern_industrialization]]
modId="jei"
type="optional"
versionRange="${jei_version_range}"
ordering="NONE"
side="CLIENT"


name: 'CI 26.2 port'

# Drift probe + jar build for the NeoForge 26.2 port.
on:
  push:
    branches:
      - 'port/26.2'
  workflow_dispatch:

concurrency:
  group: ci-26-2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MI_VERSION: 0.0.0-port-26.2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Fast fail on API drift, both source sets, collect all errors.
      - name: Compile (drift probe)
        run: ./gradlew compileJava compileClientJava --continue

      # Jar build; skip style/test verification gates during the port.
      - name: Build jar
        run: ./gradlew build -x check

      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: dist
          path: build/libs/
